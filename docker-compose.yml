# Local development with one command.
#
# Postgres, the API and the worker. The frontend stays outside on purpose —
# Vite's dev server is faster on the host, and containerising it buys nothing.

services:
  # S3-compatible object storage. This is what a real deployment uses instead of
  # a shared disk: the API and the worker are separate processes, and on
  # separate hosts they do not share a filesystem.
  minio:
    image: quay.io/minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: attestminio
      MINIO_ROOT_PASSWORD: attestminio123
    ports: ['9000:9000']
    volumes: ['attest-minio:/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 10

  # Creates the bucket once, then exits. Without it the first upload fails
  # against a bucket that does not exist yet.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 attestminio attestminio123 &&
             mc mb --ignore-existing local/attest-documents"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: attest
      POSTGRES_DB: attest
    ports: ['5432:5432']
    volumes: ['attest-pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10

  api:
    build: ./backend
    # Migrations run before the API accepts a request, so a release that adds a
    # column cannot start serving before the column exists.
    command: sh -c "node db/migrate.js && node src/server.js"
    environment: &env
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:attest@postgres:5432/attest
      JWT_ACCESS_SECRET: local-development-access-secret-32-chars
      JWT_REFRESH_SECRET: local-development-refresh-secret-differs
      CORS_ORIGIN: http://localhost:5173
      # Object storage, not a disk — the shape a real deployment takes.
      STORAGE_BACKEND: s3
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: attest-documents
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY_ID: attestminio
      STORAGE_SECRET_ACCESS_KEY: attestminio123
      STORAGE_FORCE_PATH_STYLE: 'true'
      # Both processes MUST use the same key, or the worker cannot decrypt what
      # the API stored. This is the single most important line in the file.
      STORAGE_ENCRYPTION_KEY: 7Yw7bejOIDQst8wkJ1MVkRHIjQKQ/H4Z5xxJEYUbZ4w=
    ports: ['4000:4000']
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  worker:
    build: ./backend
    command: node src/workers/index.js
    # The image's HEALTHCHECK probes the HTTP health endpoint, which only the
    # API serves. Inherited unchanged, the worker would sit permanently
    # unhealthy while doing its job perfectly — a false alarm that trains you to
    # ignore the real ones.
    healthcheck:
      disable: true
    environment: *env
    depends_on:
      postgres: { condition: service_healthy }
      # Waits for the API, which runs migrations before reporting healthy. The
      # worker would otherwise start against a schema that has no job table yet
      # and log a wall of "function attest_claim_job does not exist" until it
      # appeared. It recovers on its own — but an error you are meant to ignore
      # is indistinguishable from one you are not.
      api: { condition: service_healthy }

volumes:
  attest-pgdata:
  attest-minio:
