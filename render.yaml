# Render blueprint: database, API and worker.
#
# The worker is a SEPARATE service, not a thread inside the API. Parsing is
# CPU-heavy; sharing a process means one large statement makes every request
# slow, and it means the answer to "we need more throughput" is a bigger box
# rather than another worker.

databases:
  - name: attest-db
    databaseName: attest
    plan: free
    postgresMajorVersion: '16'

services:
  - type: web
    name: attest-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    # Migrations run before the new instance serves traffic.
    dockerCommand: sh -c "node db/migrate.js && node src/server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: attest-db, property: connectionString }
      # Generated once by Render and never seen by anyone, which is what a
      # signing secret should be.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # MUST be set by hand to a base64 32-byte key, and MUST match the worker.
      # Deliberately not generateValue: Render would generate a different one
      # for each service, and the worker would be unable to decrypt anything the
      # API stored. See render notes in README.
      - key: STORAGE_ENCRYPTION_KEY
        sync: false
      - key: STORAGE_SIGNING_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # Object storage, not a disk. Render's free tier does not share a disk
      # between services, so the worker could not read what the API wrote —
      # and even on a paid plan a shared disk stops working the moment there
      # is more than one instance of either.
      - key: STORAGE_BACKEND
        value: s3
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false

  - type: worker
    name: attest-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    dockerCommand: node src/workers/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: attest-db, property: connectionString }
      - key: JWT_ACCESS_SECRET
        fromService: { name: attest-api, type: web, envVarKey: JWT_ACCESS_SECRET }
      - key: JWT_REFRESH_SECRET
        fromService: { name: attest-api, type: web, envVarKey: JWT_REFRESH_SECRET }
      # The same key as the API, by hand. This is the single most important
      # value to get right in the whole file.
      - key: STORAGE_ENCRYPTION_KEY
        sync: false
      # And the same bucket, for the same reason.
      - key: STORAGE_BACKEND
        value: s3
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
